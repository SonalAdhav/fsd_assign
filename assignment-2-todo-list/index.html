<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment 2 - DOM To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>To-Do List</h1>

    <div class="add-row">
      <input type="text" id="taskInput" placeholder="Add a new task..." />
      <button id="addBtn">Add</button>
    </div>

    <ul id="taskList"></ul>
    <p id="emptyMsg" class="empty">No tasks yet. Add one above.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
