<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment 1 - JavaScript Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Calculator</h1>

    <label for="num1">First number</label>
    <input type="number" id="num1" placeholder="Enter first number" />

    <label for="num2">Second number</label>
    <input type="number" id="num2" placeholder="Enter second number" />

    <div class="buttons">
      <button data-op="add">+</button>
      <button data-op="subtract">−</button>
      <button data-op="multiply">×</button>
      <button data-op="divide">÷</button>
    </div>

    <p id="result" class="result">Result will appear here</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
