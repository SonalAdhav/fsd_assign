<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment 3 - Form Validation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>User Registration</h1>

    <form id="regForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Your full name" />
        <small class="error" id="nameError"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
        <small class="error" id="emailError"></small>
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10" />
        <small class="error" id="phoneError"></small>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min 8 characters" />
        <small class="error" id="passwordError"></small>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" placeholder="Re-enter password" />
        <small class="error" id="confirmError"></small>
      </div>

      <button type="submit">Register</button>
      <p id="successMsg" class="success"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
