<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment 5 - Controlled React Form (demo)</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Segoe UI", system-ui, sans-serif;
  background: #f1f5f9;
  color: #0f172a;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: center;
  gap: 1.25rem;
  padding: 2rem 1rem;
}

.card {
  width: 100%;
  max-width: 380px;
  background: #fff;
  border-radius: 16px;
  padding: 1.75rem 1.5rem;
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
}

h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
h2 { font-size: 1.15rem; margin-bottom: 0.75rem; }

label { display: block; font-size: 0.85rem; color: #64748b; margin: 0.8rem 0 0.3rem; }

input, select, textarea {
  width: 100%;
  padding: 0.65rem 0.8rem;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 1rem;
  font-family: inherit;
}
input:focus, select:focus, textarea:focus { outline: 2px solid #2563eb; border-color: transparent; }

button {
  width: 100%;
  margin-top: 1.25rem;
  padding: 0.75rem;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  color: #fff;
  background: #2563eb;
  cursor: pointer;
}
button:hover { opacity: 0.9; }

.preview p { margin-bottom: 0.5rem; word-break: break-word; min-height: 1.4rem; }
.preview { background: #eff6ff; }

  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Quick demo: React loaded from CDN so this page opens without npm. -->
  <!-- The real Vite project source is in the src/ folder. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

  <script type="text/babel">
const { useState } = React;

function App() {
  // One state object holds all form values (controlled inputs)
  const [formData, setFormData] = useState({
    name: "",
    email: "",
    age: "",
    course: "MCA",
    message: "",
  });

  // One handler for every field – uses the input's "name" attribute
  const handleChange = (event) => {
    const { name, value } = event.target;
    setFormData({ ...formData, [name]: value });
  };

  const handleSubmit = (event) => {
    event.preventDefault();
    alert("Form submitted for " + (formData.name || "unknown user"));
  };

  return (
    <main className="app">
      <form className="card" onSubmit={handleSubmit}>
        <h1>Controlled Form</h1>

        <label htmlFor="name">Name</label>
        <input
          id="name"
          name="name"
          type="text"
          value={formData.name}
          onChange={handleChange}
          placeholder="Enter your name"
        />

        <label htmlFor="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          value={formData.email}
          onChange={handleChange}
          placeholder="Enter your email"
        />

        <label htmlFor="age">Age</label>
        <input
          id="age"
          name="age"
          type="number"
          value={formData.age}
          onChange={handleChange}
          placeholder="Enter your age"
        />

        <label htmlFor="course">Course</label>
        <select
          id="course"
          name="course"
          value={formData.course}
          onChange={handleChange}
        >
          <option value="MCA">MCA</option>
          <option value="MBA">MBA</option>
          <option value="BCA">BCA</option>
          <option value="BTech">B.Tech</option>
        </select>

        <label htmlFor="message">Message</label>
        <textarea
          id="message"
          name="message"
          rows="3"
          value={formData.message}
          onChange={handleChange}
          placeholder="Write something..."
        />

        <button type="submit">Submit</button>
      </form>

      {/* Real-time display of the entered data */}
      <section className="card preview">
        <h2>Live Preview</h2>
        <p><strong>Name:</strong> {formData.name}</p>
        <p><strong>Email:</strong> {formData.email}</p>
        <p><strong>Age:</strong> {formData.age}</p>
        <p><strong>Course:</strong> {formData.course}</p>
        <p><strong>Message:</strong> {formData.message}</p>
      </section>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
